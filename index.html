  <style>
    :root{--paper:#fffcf6;--ink:#3e3a39;--coral:#f2a497;--yellow:#f6d27a;--blue:#a8d3e6;--green:#b9daa5;--white:#fffefa;--muted:#746e6b;--line:3px solid var(--ink);--shadow:5px 5px 0 var(--ink)}
    *{box-sizing:border-box}

    button,input{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}svg{display:block;max-width:100%}
    .skip{position:fixed;left:10px;top:-80px;z-index:100;background:var(--yellow);border:var(--line);border-radius:14px;padding:8px 14px}.skip:focus{top:8px}
    .shell{width:min(100% - 28px,1120px);margin-inline:auto}

    main{padding-top:72px}.hero{padding:38px 0 28px;position:relative}.hero-title{text-align:center;position:relative;z-index:2}.hero-title h1{font-size:clamp(43px,9vw,76px);line-height:1;margin:0;letter-spacing:.03em}.hero-title p{display:inline-block;margin:14px 0 23px;padding:5px 25px;background:var(--yellow);border-radius:999px;font-size:clamp(16px,3vw,21px);font-weight:900}
    .accent{position:absolute;font-size:32px;color:#e97962;font-weight:900}.accent.a1{left:13%;top:48px;transform:rotate(-20deg)}.accent.a2{right:13%;top:76px;transform:rotate(18deg)}
    .landscape{position:relative;overflow:hidden;width:100%;background:var(--paper);border:var(--line);border-radius:30px;box-shadow:var(--shadow)}.landscape>svg{display:none}.hero-generated{display:block;width:100%;height:auto}.car{animation:ride 4s ease-in-out infinite}.steam{animation:steam 2.8s ease-in-out infinite;transform-origin:bottom}.steam.s2{animation-delay:.65s}.plane{animation:fly 6s ease-in-out infinite}.sun{animation:float 5s ease-in-out infinite;transform-origin:center}.branch{animation:sway 4.5s ease-in-out infinite;transform-origin:right}.wave{animation:wave 3.2s ease-in-out infinite}
    .trip-strip{display:grid;grid-template-columns:1fr;gap:7px;margin:13px 0 0}.trip-fact{display:flex;align-items:center;gap:9px;border-bottom:2px dashed var(--ink);padding:9px 4px;font-size:15px;font-weight:900}.trip-fact span:first-child{font-size:23px}.count-bubble{position:absolute;right:3.5%;bottom:6%;z-index:5;display:flex;align-items:center;gap:9px;background:var(--white);border:var(--line);border-radius:50% 46% 52% 45%;padding:9px 18px;box-shadow:4px 4px 0 var(--coral);font-weight:900;transform:rotate(-2deg)}.count-bubble b{font-size:40px;line-height:1;color:#df705b}.count-bubble small{font-size:14px}.count-bubble .time{font-size:11px;color:var(--muted);font-weight:800}
    .section{padding:42px 0}.section-label{display:flex;align-items:center;gap:12px;margin-bottom:18px}.section-label h2{margin:0;flex:0 0 auto;border:var(--line);border-radius:999px;padding:5px 16px;background:var(--blue);font-size:23px;line-height:1.2}.section-label:after{content:"";flex:1;border-top:3px dotted #aaa09a}.section-label.coral h2{background:var(--coral)}.section-label.green h2{background:var(--green)}

    .planner{padding:20px 0 55px}.day-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}.day-tab{background:var(--white);border:var(--line);border-radius:19px;padding:8px 4px;font-weight:900;line-height:1.15}.day-tab small{display:block;font-size:12px;margin-top:3px}.day-tab[aria-selected="true"]{background:var(--coral);color:var(--white);box-shadow:3px 3px 0 var(--ink);transform:translateY(-2px)}

    .timeline{position:relative;margin-top:5px}.timeline:before{content:"";position:absolute;left:15px;top:17px;bottom:17px;border-left:3px solid #e97962}.stop{position:relative;display:grid;grid-template-columns:32px 1fr;gap:10px;padding:9px 0}.stop-dot{z-index:1;width:19px;height:19px;margin:4px 0 0 6px;border:3px solid #e97962;border-radius:50%;background:var(--paper)}.stop:last-child .stop-dot{background:var(--coral)}.stop-main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:8px;align-items:center}.stop-copy{min-width:0}.stop-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.stop-name{font-size:16px;font-weight:900}.stop-time{flex:0 0 auto;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:1px 7px;font-size:11px;font-weight:900}.stop-note{font-size:13px;color:var(--muted);font-weight:700}.transit{display:inline-block;margin-top:4px;background:var(--green);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:900}.must{display:inline-block;margin-left:5px;background:var(--coral);border:2px solid var(--ink);border-radius:999px;padding:0 6px;font-size:10px;vertical-align:2px}.mini-art{width:82px;height:58px;overflow:visible}.mini-art *{vector-effect:non-scaling-stroke}

    .stay-col{display:grid;gap:14px;align-content:start}.tonight{overflow:hidden}.tonight-head{display:inline-flex;align-items:center;gap:8px;background:var(--coral);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:17px;font-weight:900}.tonight-body{display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center;margin-top:12px}.tonight h3{font-size:23px;line-height:1.2;margin:0 0 6px}.tonight p{margin:3px 0;font-size:13px;font-weight:800;color:var(--muted)}.hotel-art{align-self:end}
    .hotel-list-title{display:inline-block;margin:-6px 0 10px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:17px;font-weight:900}.hotel-row{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #aaa09a}.hotel-row:last-child{border:0}.hotel-date{background:var(--coral);border-radius:14px;padding:5px;text-align:center;font-size:12px;font-weight:900}.hotel-row.active{background:#fff3bf;border-radius:15px;padding-inline:7px}.hotel-row.active .hotel-date{background:var(--yellow)}.hotel-name{font-weight:900}.hotel-city{font-size:12px;color:var(--muted);font-weight:800}

    @keyframes ride{50%{transform:translate(8px,-3px)}}@keyframes steam{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-9px);opacity:1}}@keyframes fly{50%{transform:translate(10px,-5px) rotate(1deg)}}@keyframes float{50%{transform:translateY(-6px) rotate(1deg)}}@keyframes sway{50%{transform:rotate(2deg)}}@keyframes wave{50%{transform:translateX(6px)}}@keyframes pop{0%{transform:scale(.97);opacity:.5}70%{transform:scale(1.01)}100%{transform:scale(1);opacity:1}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

    function weatherText(code){if(code===0)return '晴朗';if(code<=3)return '多雲';if(code===45||code===48)return '有霧';if(code>=71&&code<=77)return '降雪';if(code>=85&&code<=86)return '陣雪';if(code>=95)return '雷雨';if(code>=51&&code<=67)return '降雨';if(code>=80&&code<=82)return '陣雨';return '天候變化'}
    function renderRisk(i){const meta=dayMeta[i],sunset=sunsetTime(meta.iso,meta.lat,meta.lon),alerts=days[i].items.filter(x=>hoursMeta[x[1]]);return `<section class="risk-board" aria-label="冬季行程風險"><div class="risk-title"><span>❄ 冬季行程提醒</span><span class="risk-live">${meta.place}</span></div><div class="risk-grid"><div class="risk-item" id="weather-${i}" aria-live="polite"><strong>天氣預報</strong><span>正在確認預報範圍…</span></div><div class="risk-item warn"><strong>日落時間</strong><span>約 ${sunset}，山區提早返程</span></div><div class="risk-item ${alerts.length?'warn':''}"><strong>營業／開放</strong><span>${alerts.length?`${alerts.length} 個地點需確認`:'本日無特別警示'}</span></div>${alerts.length?`<details class="hours-list"><summary>查看 ${alerts.length} 則營業與冬季風險</summary><ul>${alerts.map(x=>`<li><b>${x[1]}</b>：${hoursMeta[x[1]]} <a class="hours-link" href="${searchUrl(x[1])}" target="_blank" rel="noopener noreferrer">查即時資訊</a></li>`).join('')}</ul></details>`:''}</div></section>`}
    async function updateWeather(i){const meta=dayMeta[i],box=document.querySelector(`#weather-${i}`);if(!box)return;const today=new Date(),target=new Date(`${meta.iso}T00:00:00+09:00`),daysAway=Math.ceil((target-today)/864e5);if(daysAway<0){box.querySelector('span').textContent='旅程日期已過，請查歷史紀錄';return}if(daysAway>15){const open=new Date(target-15*864e5);box.querySelector('span').textContent=`${open.getMonth()+1}/${open.getDate()} 起自動更新`;return}try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${meta.lat}&longitude=${meta.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=Asia%2FTokyo&start_date=${meta.iso}&end_date=${meta.iso}`;const response=await fetch(url);if(!response.ok)throw new Error('forecast');const data=await response.json(),daily=data.daily,code=daily.weather_code[0],rain=daily.precipitation_probability_max[0],wind=daily.wind_speed_10m_max[0],low=daily.temperature_2m_min[0],high=daily.temperature_2m_max[0];if(panel.dataset.dayIndex!==String(i))return;box.querySelector('span').textContent=`${weatherText(code)} ${low}–${high}°C・降雨 ${rain}%・風 ${Math.round(wind)} km/h`;box.classList.toggle('danger',code>=71||rain>=60||wind>=35);box.classList.toggle('warn',!box.classList.contains('danger')&&(rain>=35||wind>=25||low<=2))}catch(e){box.querySelector('span').textContent='暫時無法連線，請稍後重試';box.classList.add('warn')}}
    function renderHotels(active){hotelList.innerHTML=hotels.map((h,i)=>`<div class="hotel-row ${i===active?'active':''}"><div class="hotel-date">${h.date}<br>（${h.dow}）</div><div><div class="hotel-name">${h.name}${i===3?' ♨':''}</div><div class="hotel-city">⌖ ${h.city}</div></div></div>`).join('')}
    function renderDay(i,animate=false){const d=days[i],h=hotels[Math.min(i,hotels.length-1)];document.querySelectorAll('.day-tab').forEach((b,n)=>{b.setAttribute('aria-selected',n===i?'true':'false');b.tabIndex=n===i?0:-1});panel.setAttribute('aria-labelledby',`tab-${i}`);panel.dataset.dayIndex=i;panel.innerHTML=`<header class="day-head"><span class="day-no">DAY ${i+1}</span><div><h3>${d.date}（${d.dow}）</h3><p>${d.route}</p></div></header>${renderRisk(i)}<div class="drive-summary">🚗 自駕行程・即時路況請開啟 Google Maps</div><div class="timeline">${d.items.map(x=>`<div class="stop"><span class="stop-dot"></span><div class="stop-main"><div class="stop-copy"><div class="stop-top"><div class="stop-name">${x[1]}${x[4]?'<span class="must">必去</span>':''}</div><span class="stop-time">${x[0]}</span></div>${x[2]?`<div class="stop-note">${x[2]}</div>`:''}<div class="stop-actions">${x[3]?`<span class="transit">${transitLabel(x[3])}</span>`:''}${mapLink(x[1])}</div></div>${miniRaster(x[1])}</div></div>`).join('')}</div>`;tonight.innerHTML=`<div class="tonight-head">▰ 本日住宿</div><div class="tonight-body"><div><h3>${h.name}</h3><p>♨ ${i===3?'高原溫泉旅宿':'今晚好好休息'}</p><p>⌖ ${h.address}</p><div class="stay-map">${mapLink(h.name,'導航住宿')}</div></div>${hotelArt}</div>`;renderHotels(Math.min(i,4));updateWeather(i);if(animate){panel.classList.remove('is-switching');void panel.offsetWidth;panel.classList.add('is-switching');panel.focus({preventScroll:true})}}
    tabs.addEventListener('keydown',e=>{const list=[...tabs.children],now=list.findIndex(x=>x.getAttribute('aria-selected')==='true');let next=now;if(e.key==='ArrowRight')next=(now+1)%list.length;if(e.key==='ArrowLeft')next=(now-1+list.length)%list.length;if(next!==now){e.preventDefault();renderDay(next,true);list[next].focus()}});renderDay(3);
    const listData=[
      {title:'🗓 出發前清單',items:['確認護照效期與入境資料','完成線上報到、確認行李額度','預約租車並備妥駕照日文譯本','確認旅遊保險與緊急聯絡方式','下載離線地圖與行程備份','確認雪況、路況與景點營業時間']},
      {title:'🎫 隨身重要物',items:['護照、機票與住宿憑證','日圓、信用卡與零錢包','手機、充電線與行動電源','駕照與日文譯本','常備藥與個人處方藥','保溫瓶、面紙與環保袋']},
      {title:'🧳 冬日行李',items:['保暖外套與防風層','發熱衣、毛衣與長褲','毛帽、圍巾與手套','防滑好走的鞋與厚襪','折傘或輕便雨衣','泡湯小袋與保養品']}
    ];
    const listRoot=document.querySelector('#lists'),storeKey='oita-trip-checks-v2';let saved={};try{saved=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){}
    listData.forEach((g,gi)=>{const card=document.createElement('section');card.className='check-card';card.innerHTML=`<div class="check-top"><h3>${g.title}</h3><span class="progress" id="progress-${gi}">0/${g.items.length}</span></div><ul class="checklist">${g.items.map((item,i)=>`<li><label><input type="checkbox" data-key="${gi}-${i}" ${saved[`${gi}-${i}`]?'checked':''}><span>${item}</span></label></li>`).join('')}</ul>`;listRoot.appendChild(card)});
    function updateProgress(){listData.forEach((g,i)=>{const all=[...document.querySelectorAll(`[data-key^="${i}-"]`)];document.querySelector(`#progress-${i}`).textContent=`${all.filter(x=>x.checked).length}/${all.length}`})}updateProgress();listRoot.addEventListener('change',e=>{if(!e.target.matches('input'))return;saved[e.target.dataset.key]=e.target.checked;localStorage.setItem(storeKey,JSON.stringify(saved));updateProgress()});
    const departure=new Date('2026-12-25T06:20:00+08:00');function tick(){let diff=departure-Date.now();const daysEl=document.querySelector('#days'),clock=document.querySelector('#clock');if(diff<=0){daysEl.textContent='0';clock.textContent=Date.now()<new Date('2026-12-30T18:10:00+08:00')?'旅程進行中':'旅程完成';return}const d=Math.floor(diff/864e5);diff%=864e5;const h=Math.floor(diff/36e5);diff%=36e5;const m=Math.floor(diff/6e4),s=Math.floor(diff%6e4/1e3);daysEl.textContent=d;clock.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}tick();setInterval(tick,1000);
  </script>
</body>
